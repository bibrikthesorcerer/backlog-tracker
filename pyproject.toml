[project]
name = "backlog-tracker"
version = "0.1.0"
description = ""
authors = [
    {name = "bibrikthesorcerer",email = "ignatsahovsky@gmail.com"}
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "django-rest-framework (>=0.1.0,<0.2.0)",
    "pre-commit (>=4.5.1,<5.0.0)",
    "psycopg (>=3.3.3,<4.0.0)",
    "django-split-settings (>=1.3.2,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "dynaconf (>=3.2.13,<4.0.0)",
    "django-service-objects @ git+https://git.snpdev.ru/saltpepper/django-service-objects.git@master",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "django (>=5.0.0,<6.0.0)",
    "service-objects-autodocs @ git+https://git.snpdev.ru/saltpepper/service-objects-autodocs.git",
    "factory-boy (>=3.3.3,<4.0.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "django-viewflow (>=2.2.15,<3.0.0)",
    "django-log-request-id (>=2.1.2,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pylint (>=4.0.5,<5.0.0)",
    "pylint-django (>=2.7.0,<3.0.0)",
    "aiosmtpd (>=1.4.6,<2.0.0)"
]